services:
  db:
    image: postgres:16.15-bookworm
    container_name: agecare-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=es-CL"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Los .sql se ejecutan automáticamente SOLO la primera vez
      # que se crea el volumen pgdata (en orden alfabético).
      - ./sql:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [agecare-net]

  api:
    build: ./api
    container_name: agecare-api
    environment: &entorno_api
      # La API se conecta a la BD por el nombre de servicio de la red interna.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Sin fallback a proposito (DevSecOps — F5): si JWT_SECRET no esta en el
      # entorno, la variable queda vacia y la API se niega a arrancar, en vez
      # de firmar tokens con un secreto publico del repo. Antes habia un
      # `:-dev-secret-cambiar-en-produccion` que arrancaba inseguro en silencio.
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el .env (openssl rand -hex 32)}

      # Donde estan los .sql que la api aplica al arrancar. La imagen copia
      # solo la carpeta app, asi que los .sql entran montados desde el host
      # (el volumen de mas abajo) y esta variable dice en que ruta quedaron.
      AGECARE_SQL_DIR: /sql

      # Zona horaria de la operacion. Decide a que DIA pertenece cada
      # instante guardado: "las dosis de hoy", "las tareas completadas
      # hoy". Dejarla sin poner significaba calcular los dias en UTC.
      TIMEZONE: ${TIMEZONE:-America/Santiago}

      # Almacenamiento de archivos subidos (fotos, documentos, notas de voz).
      # 'local' guarda en disco dentro del contenedor, en la ruta de abajo,
      # que está montada como volumen para que no se pierda al reiniciar.
      # Con 'azure' se usa Blob Storage y estas dos dejan de importar.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_DIR: /var/agecare/files
      # URL pública de la API. Es la que se arma en los enlaces temporales
      # de subida y descarga, así que tiene que ser la que el teléfono
      # alcanza, no localhost.
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://localhost:8000}
      AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT:-}
      AZURE_STORAGE_KEY: ${AZURE_STORAGE_KEY:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-agecare}

      # Asistente de IA. Con 'none' los endpoints responden 503 con un
      # codigo que la aplicacion distingue, en vez de inventar respuestas
      # sobre la salud de un paciente.
      ASSISTANT_PROVIDER: ${ASSISTANT_PROVIDER:-none}
      ASSISTANT_ENDPOINT: ${ASSISTANT_ENDPOINT:-}
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-gpt-4o-mini}
      # Solo para 'openai_compatible' (Claude, NVIDIA, Groq...).
      ASSISTANT_BASE_URL: ${ASSISTANT_BASE_URL:-}
      ASSISTANT_SEND_SAMPLING: ${ASSISTANT_SEND_SAMPLING:-true}

      # Voz: transcripcion de notas y lectura en voz alta. Mismo criterio.
      SPEECH_PROVIDER: ${SPEECH_PROVIDER:-none}

      # Lectura del texto de las imagenes. 'tesseract' corre dentro de este
      # mismo contenedor, asi que la foto de una receta no sale del servidor.
      # Con 'none' los endpoints responden 503 con un codigo que la
      # aplicacion distingue, igual que el asistente y la voz.
      OCR_PROVIDER: ${OCR_PROVIDER:-tesseract}
      # Solo para 'nvidia_parse'. Sin OCR_API_KEY usa ASSISTANT_API_KEY.
      OCR_API_KEY: ${OCR_API_KEY:-}

      # Cobro de la suscripcion premium. 'simulated' aprueba sin mover
      # dinero (Alloxentric aun no elige pasarela, ver app/payment_provider.py).
      # Con 'none' contratar responde 503. NO dejar 'simulated' en produccion.
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-simulated}
      SPEECH_REGION: ${SPEECH_REGION:-}
      SPEECH_API_KEY: ${SPEECH_API_KEY:-}
    ports:
      # 0.0.0.0 = accesible desde otras máquinas de la red local (para que el
      # frontend de un compañero pueda probar). Solo la API se expone; la BD
      # (5432) y pgadmin (5050) siguen restringidos a 127.0.0.1 por seguridad.
      - "0.0.0.0:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Sin esto los archivos que la gente sube viven dentro del contenedor
      # y se pierden en cada reinicio.
      - archivos:/var/agecare/files
      # Los mismos .sql que la base ejecuta la primera vez. La api los
      # necesita para poner al dia una base que ya existia: el volumen de
      # la base solo los corre cuando se crea, asi que los archivos
      # agregados despues nunca llegaron a quien ya la tenia levantada.
      - ./sql:/sql:ro,Z
    restart: unless-stopped
    networks: [agecare-net]

  # Las tareas del dia: generar las dosis, marcar las vencidas, crear las
  # alertas y calcular el semaforo. Sin esto la pantalla de medicamentos
  # sale vacia, la adherencia da cero y el semaforo se queda pegado en el
  # ultimo dia que alguien calculo a mano.
  #
  # Va en su propio contenedor y no dentro de la api por dos razones. Si
  # viviera en la api, correria una vez por cada replica el dia que se
  # levante mas de una. Y un proceso de fondo que se cuelga dentro del
  # servicio web se lleva al servicio web con el.
  mantenimiento:
    build: ./api
    container_name: agecare-mantenimiento
    command: /usr/local/bin/mantenimiento.sh
    environment:
      <<: *entorno_api
      # Cada hora. Marcar una dosis vencida a tiempo y avisar de una
      # medicion fuera de rango no pueden esperar hasta manana.
      MANTENIMIENTO_INTERVALO_SEG: ${MANTENIMIENTO_INTERVALO_SEG:-3600}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Necesita el mismo volumen que la api: una de sus tareas es borrar
      # los binarios de las subidas que nunca llegaron.
      - archivos:/var/agecare/files
    restart: unless-stopped
    networks: [agecare-net]

  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    container_name: agecare-cloudflared
    # user root: en Podman rootless equivale a tu usuario del host, así el
    # contenedor puede LEER el cert.pem y las credenciales (permisos 0400).
    user: root
    # Ejecuta el túnel con nombre usando el config.yml y las credenciales
    # montadas desde ~/.cloudflared del host.
    command: tunnel --config /home/nonroot/.cloudflared/config.yml run
    volumes:
      - ${HOME}/.cloudflared:/home/nonroot/.cloudflared:ro,Z
    depends_on:
      - api
    restart: unless-stopped
    networks: [agecare-net]

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: agecare-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      db:
        condition: service_healthy
    networks: [agecare-net]

volumes:
  pgdata:
  archivos:

networks:
  agecare-net:
