name: agecare_app
description: "AgeCare - Suite de cuidado de adultos mayores. App Flutter (familiar, cuidadora, adulto mayor)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado y navegación
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Red y almacenamiento
  dio: ^5.5.0
  flutter_secure_storage: ^9.2.2

  # Wearables (Spike API) — SDK v3 (SpikeSDKV3): HealthKit / Health Connect / Garmin / Whoop
  spike_flutter_sdk: ^4.7.14

  # Lectura nativa de Health Connect (Android) / HealthKit (iOS) para conectar
  # un reloj real (p. ej. Samsung Galaxy Watch 4 vía Samsung Health -> Health
  # Connect). Alternativa directa a Spike para pruebas locales.
  health: ^12.0.0

  # Tiempo real y multimedia
  web_socket_channel: ^3.0.3     # chat WS (/ws/patients/{id}/chat)
  image_picker: ^1.1.2           # fotos, escaneo de recetas
  record: ^7.1.1                 # captura de notas de voz (STT)
  audioplayers: ^6.1.0           # reproducción de notas de voz y TTS
  url_launcher: ^6.3.1           # tel:, mailto:, enlaces de invitación
  share_plus: ^10.1.2            # compartir enlace de invitación
  path_provider: ^2.1.4          # rutas temporales para notas de voz

  # Notificaciones y sensores
  flutter_local_notifications: ^17.2.4 # alarmas de medicación locales
  firebase_core: ^3.8.0                # base para FCM
  firebase_messaging: ^15.1.5          # token de push -> Azure Notification Hubs
  permission_handler: ^11.3.1          # permisos de micrófono/ubicación/notif.
  geolocator: ^13.0.2                  # ubicación para SOS

  # Monetización
  in_app_purchase: ^3.2.1        # premium de la cuidadora (IAP)

  # UI
  fl_chart: ^0.68.0
  intl: ^0.20.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

# Configuración del ícono de la app (se genera con:
#   dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/Agecare.png"
  min_sdk_android: 28
  # Ícono adaptativo (Android 8+): logo sobre fondo blanco de la marca.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/Agecare.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
